<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
      href="/css/mobile.css"
      media="screen and (max-width:768px)">

</head>

<body class="category-page">

<!-- VIDEO BACKGROUND -->

<video autoplay muted loop playsinline preload="metadata" id="bg-video">
    <source src="/Video/3.mp4" type="video/mp4">
</video>

<!-- LOGO -->

<div class="top-logo">
    <img src="/Images/Logo.png">
</div>

<!-- LIVE TEXT -->

<div class="typing-text" id="live-text">
<span id="typing"></span>
</div>

<!-- MUSIC NOTES -->

<div class="music-notes">

<span>♪</span>
<span>♫</span>
<span>♬</span>
<span>♩</span>
<span>𝄞</span>
<span>♭</span>
<span>♯</span>
<span>♬</span>
<span>♫</span>
<span>♪</span>
<span>♩</span>
<span>𝄢</span>

</div>

<!-- ADMIN LOGIN -->

<section class="login-section">

    <h1 class="login-title">
        ADMINISTRATOR LOGIN
    </h1>

    <div class="login-form">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <button onclick="login()">
            Login
        </button>

        <p id="error"></p>

    </div>

</section>

<!-- LOGIN FUNCTION -->

<script>

function login(){

    const password =
        document.getElementById("password").value;

    const correctPassword =
        "VizagJamHub123";

    if(password === correctPassword){

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        window.location.href =
            "admin.html";

    }else{

        document.getElementById("error")
            .textContent =
            "Incorrect Password";

    }

}

</script>

<!-- LIVE TEXT SCRIPT -->

<script>

const words = [

"ADMIN ACCESS",
"VIZAG JAM HUB",
"LIVE MUSIC",
"JAM SESSIONS",
"MUSIC COMMUNITY"

];

const typing =
document.getElementById("typing");

let index = 0;

typing.textContent = words[index];
typing.classList.add("show");

setInterval(() => {

typing.classList.remove("show");
typing.classList.add("hide");

setTimeout(() => {

index = (index + 1) % words.length;

typing.textContent = words[index];

typing.classList.remove("hide");
typing.classList.add("show");

}, 900);

}, 3200);

</script>

</body>

</html>
