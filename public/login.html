<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
      href="/css/mobile.css"
      media="screen and (max-width:768px)">

</head>

<body class="category-page">

<!-- VIDEO BACKGROUND -->

<video autoplay muted loop playsinline preload="metadata" id="bg-video">
    <source src="/Video/3.mp4" type="video/mp4">
</video>

<!-- LOGO -->

<div class="top-logo">
    <img src="/Images/Logo.png">
</div>

<!-- LIVE TEXT -->

<div class="typing-text" id="live-text">
<span id="typing"></span>
</div>

<!-- MUSIC NOTES -->

<div class="music-notes">

<span>♪</span>
<span>♫</span>
<span>♬</span>
<span>♩</span>
<span>𝄞</span>
<span>♭</span>
<span>♯</span>
<span>♬</span>
<span>♫</span>
<span>♪</span>
<span>♩</span>
<span>𝄢</span>

</div>

<!-- ADMIN LOGIN -->

<section class="login-section">

    <h1 class="login-title">
        ADMINISTRATOR LOGIN
    </h1>

    <div class="login-form">

    <!-- PASSWORD FIELD -->

<div class="password-wrapper">

    <input
        type="password"
        id="password"
        placeholder="Enter Password">

    <span
        class="toggle-password"
        onclick="togglePassword()">
        👁
    </span>

</div>

    <button onclick="login()">
        Login
    </button>

    <p id="error"></p>

    </div>

</section>

<!-- LOGIN FUNCTION -->

<script>

function login(){

    const passwordField =
        document.getElementById("password");

    const error =
        document.getElementById("error");

    const password =
        passwordField.value;

    const correctPassword =
        "VizagJamHub@123d";

    if(password === correctPassword){

        error.textContent = "";

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        window.location.href =
            "admin.html";

    }else{

    error.textContent =
        "Incorrect Password";

    passwordField.classList.add(
        "shake"
    );

    passwordField.value = "";

    passwordField.focus();

    setTimeout(() => {

        passwordField.classList.remove(
            "shake"
        );

    }, 400);

}

}

/* SHOW / HIDE PASSWORD */

function togglePassword(){

    const password =
        document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

}

/* ENTER KEY LOGIN */

document
.getElementById("password")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        login();

    }

});



/* CLEAR ERROR WHEN USER TYPES AGAIN */

document
.getElementById("password")
.addEventListener("input", () => {

    document
    .getElementById("error")
    .textContent = "";

});


</script>





<!-- LIVE TEXT SCRIPT -->

<script>

const words = [

"ADMIN ACCESS",
"VIZAG JAM HUB",
"LIVE MUSIC",
"JAM SESSIONS",
"MUSIC COMMUNITY"

];

const typing =
document.getElementById("typing");

let index = 0;

typing.textContent = words[index];
typing.classList.add("show");

setInterval(() => {

typing.classList.remove("show");
typing.classList.add("hide");

setTimeout(() => {

index = (index + 1) % words.length;

typing.textContent = words[index];

typing.classList.remove("hide");
typing.classList.add("show");

}, 900);

}, 3200);

</script>

</body>

</html>
