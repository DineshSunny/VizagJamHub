<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =================================
         PAGE INFORMATION
    ================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Select Script | Vizag JamHub</title>


    <!-- =================================
         DESKTOP STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/website/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/buttons.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/lyrics.css"
    >


    <!-- =================================
         MOBILE STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/mobile/global.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/buttons.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/lyrics.css"
        media="screen and (max-width:768px)"
    >


    <!-- =================================
         FONT AWESOME ICONS
    ================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body class="language-page">


    <!-- =================================
         BACKGROUND VIDEO
    ================================= -->

    <video
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        class="lyrics-video"
    >

        <source
            src="/video/1.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =================================
         FLOATING MUSIC NOTES
    ================================= -->

    <div class="music-notes">

        <span>♪</span>
        <span>♫</span>
        <span>♬</span>
        <span>♩</span>
        <span>𝄞</span>
        <span>♭</span>
        <span>♯</span>
        <span>♬</span>
        <span>♫</span>
        <span>♪</span>
        <span>♩</span>
        <span>𝄢</span>

    </div>


    <!-- =================================
         FULLSCREEN NAVIGATION
    ================================= -->

    <header>

        <!-- OPEN MENU -->

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >

            <i class="fa-solid fa-bars"></i>

        </button>


        <!-- NAVIGATION OVERLAY -->

        <div class="nav-overlay">

            <!-- CLOSE MENU -->

            <button
                class="menu-close"
                type="button"
                aria-label="Close navigation"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>


            <!-- NAVIGATION LINKS -->

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="/">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="/pages/lyrics/category.html">
                            Sing Along Lyrics
                        </a>
                    </li>

                    <li>
                        <a href="/#shows">
                            Shows
                        </a>
                    </li>

                    <li>
                        <a href="/#school">
                            School
                        </a>
                    </li>

                    <li>
                        <a href="/#connect">
                            Band Connect
                        </a>
                    </li>

                    <li>
                        <a href="/#gallery">
                            Gallery
                        </a>
                    </li>

                    <li>
                        <a href="/pages/admin/admin.html">
                            Admin Panel
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- =================================
         LANGUAGE / SCRIPT SELECTION
    ================================= -->

    <main
        style="
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        "
    >

        <!-- PAGE TITLE -->

        <h1 id="title">
            Select Script
        </h1>


        <!-- LANGUAGE OPTIONS -->

        <ul
            id="languageOptions"
            class="nav-links"
            style="
                margin-top: 40px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                list-style: none;
                padding: 0;
            "
        >
        </ul>

    </main>


    <!-- =================================
         SCRIPT SELECTION LOGIC
    ================================= -->

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const type =
            params.get("type");

        const id =
            params.get("id");

        const container =
            document.getElementById(
                "languageOptions"
            );

        const title =
            document.getElementById(
                "title"
            );


        /* =================================
           TELUGU
        ================================= */

        if (type === "telugu") {

            title.innerText =
                "Select Telugu Language";

            container.innerHTML = `

                <li>
                    <a
                        href="/pages/lyrics/telugusongs.html?id=${id}&script=english"
                        onclick="
                            event.preventDefault();
                            window.location.replace(this.href);
                        "
                    >
                        English
                    </a>
                </li>

                <li>
                    <a
                        href="/pages/lyrics/telugusongs.html?id=${id}&script=native"
                        onclick="
                            event.preventDefault();
                            window.location.replace(this.href);
                        "
                    >
                        తెలుగు
                    </a>
                </li>

            `;

        }


        /* =================================
           HINDI
        ================================= */

        else if (type === "hindi") {

            title.innerText =
                "Select Hindi Language";

            container.innerHTML = `

                <li>
                    <a
                        href="/pages/lyrics/hindisongs.html?id=${id}&script=english"
                        onclick="
                            event.preventDefault();
                            window.location.replace(this.href);
                        "
                    >
                        English
                    </a>
                </li>

                <li>
                    <a
                        href="/pages/lyrics/hindisongs.html?id=${id}&script=native"
                        onclick="
                            event.preventDefault();
                            window.location.replace(this.href);
                        "
                    >
                        हिंदी
                    </a>
                </li>

            `;

        }


        /* =================================
           INVALID ACCESS
        ================================= */

        else {

            title.innerText =
                "Invalid Access";

            container.innerHTML = `

                <li>
                    <a href="/pages/lyrics/category.html">
                        Go to Categories
                    </a>
                </li>

            `;

        }

    </script>


    <!-- =================================
         SHARED PAGE SCRIPTS
    ================================= -->

    <script src="/js/others/pagebehaviour.js"></script>

    <script src="/js/mobile/mobile.js"></script>


</body>

</html>
