<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =================================
         PAGE INFORMATION
    ================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ticket Management | Vizag JamHub</title>


    <!-- =================================
         DESKTOP STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/website/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/index.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/buttons.css"
    >


    <!-- =================================
         FONT AWESOME ICONS
    ================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


    <!-- =================================
         VIDEO BACKGROUND
    ================================= -->

    <video
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        id="bg-video"
    >

        <source
            src="/video/1.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =================================
         FLOATING MUSIC NOTES
    ================================= -->

    <div class="music-notes">

        <span>♪</span>
        <span>♫</span>
        <span>♬</span>
        <span>♩</span>
        <span>𝄞</span>
        <span>♭</span>
        <span>♯</span>
        <span>♬</span>
        <span>♫</span>
        <span>♪</span>
        <span>♩</span>
        <span>𝄢</span>

    </div>


    <!-- =================================
         FULLSCREEN NAVIGATION
    ================================= -->

    <header>


        <!-- =================================
             HAMBURGER
        ================================= -->

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >

            <i class="fa-solid fa-bars"></i>

        </button>


        <!-- =================================
             NAVIGATION OVERLAY
        ================================= -->

        <div class="nav-overlay">


            <!-- CLOSE BUTTON -->

            <button
                class="menu-close"
                type="button"
                aria-label="Close navigation"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>


            <!-- NAVIGATION -->

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="/pages/admin/admin.html">
                            Admin Panel
                        </a>
                    </li>

                    <li>
                        <a href="/pages/admin/shows/shows.html">
                            Shows
                        </a>
                    </li>

                    <li>
                        <a href="/pages/admin/tickets/ticket.html">
                            Tickets
                        </a>
                    </li>

                    <li>
                        <a href="/">
                            Home
                        </a>
                    </li>

                </ul>

            </nav>


        </div>


    </header>


    <!-- =================================
         TICKET MANAGEMENT
    ================================= -->

    <main>


        <!-- =================================
             SHOW SELECTION
        ================================= -->

        <section
            id="shows"
            class="index-shows-page"
        >


            <!-- =================================
                 TICKET MANAGEMENT HEADING
            ================================= -->

            <div class="index-shows-heading">

                <h1>
                    TICKET MANAGEMENT
                </h1>

            </div>


            <!-- =================================
                 3D SHOWS STAGE
            ================================= -->

            <div
                class="index-shows-stage"
                aria-label="Ticket Management Shows"
            >


                <!-- =================================
                     SHOWS CAROUSEL
                ================================= -->

                <div
                    id="shows-container"
                    class="index-shows"
                >

                    <!-- Shows generated by ticket.js -->

                </div>


            </div>


        </section>


        <!-- =================================
             SELECTED SHOW ANALYTICS
        ================================= -->

        <section
            id="ticket-analytics"
            hidden
        >

            <!-- Selected show analytics will be added here -->

        </section>


        <!-- =================================
             CUSTOMER TICKET DATABASE
        ================================= -->

        <section
            id="ticket-customers"
            hidden
        >

            <!-- Customer ticket database will be added here -->

        </section>


    </main>


    <!-- =================================
         SHARED JAVASCRIPT
    ================================= -->

    <script src="/js/pagebehaviour.js"></script>

    <script src="/js/mobile.js"></script>


    <!-- =================================
         TICKET MANAGEMENT JAVASCRIPT
    ================================= -->

    <script src="/js/admin/tickets/ticket.js"></script>


</body>

</html>
