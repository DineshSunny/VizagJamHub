<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =================================
         PAGE INFORMATION
    ================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hindi Songs | Vizag JamHub</title>


    <!-- =================================
         DESKTOP STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/website/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/buttons.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/pages/admin/lyrics.css"
    >


    <!-- =================================
         MOBILE STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/mobile/global.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/buttons.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/lyrics.css"
        media="screen and (max-width:768px)"
    >


    <!-- =================================
         FONT AWESOME ICONS
    ================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


    <!-- =================================
         LYRICS BACKGROUND VIDEO
    ================================= -->

    <video
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        class="lyrics-video"
    >

        <source
            src="/video/1.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =================================
         FLOATING MUSIC NOTES
    ================================= -->

    <div class="music-notes">

        <span>♪</span>
        <span>♫</span>
        <span>♬</span>
        <span>♩</span>
        <span>𝄞</span>
        <span>♭</span>
        <span>♯</span>
        <span>♬</span>
        <span>♫</span>
        <span>♪</span>
        <span>♩</span>
        <span>𝄢</span>

    </div>


    <!-- =================================
         FULLSCREEN NAVIGATION
    ================================= -->

    <header>

        <!-- OPEN MENU -->

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >

            <i class="fa-solid fa-bars"></i>

        </button>


        <!-- NAVIGATION OVERLAY -->

        <div class="nav-overlay">

            <!-- CLOSE MENU -->

            <button
                class="menu-close"
                type="button"
                aria-label="Close navigation"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>


            <!-- NAVIGATION LINKS -->

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="/">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="/pages/admin/lyrics/category.html">
                            Sing Along Lyrics
                        </a>
                    </li>

                    <li>
                        <a href="/#shows">
                            Shows
                        </a>
                    </li>

                    <li>
                        <a href="/#school">
                            School
                        </a>
                    </li>

                    <li>
                        <a href="/#connect">
                            Band Connect
                        </a>
                    </li>

                    <li>
                        <a href="/#gallery">
                            Gallery
                        </a>
                    </li>

                    <li>
                        <a href="/pages/admin/admin.html">
                            Admin Panel
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- =================================
         HINDI SONGS
    ================================= -->

    <section class="lyrics-page">


        <!-- =================================
             SONG SEARCH
        ================================= -->

        <input
            type="text"
            id="searchInput"
            class="search-bar"
            placeholder="🔍 Search songs..."
        >


        <!-- =================================
             SONG LIST / LYRICS CONTAINER
        ================================= -->

        <div id="lyrics-container"></div>


    </section>


    <!-- =================================
         HINDI SONGS SCRIPT
    ================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const container =
                    document.getElementById(
                        "lyrics-container"
                    );

                const searchInput =
                    document.getElementById(
                        "searchInput"
                    );

                let songsData = [];


                /* =================================
                   LOAD HINDI SONGS
                ================================= */

                fetch("/api/hindisongs")

                    .then((response) =>
                        response.json()
                    )

                    .then((data) => {

                        songsData = data;


                        /* =================================
                           CHECK FOR SONG ID
                        ================================= */

                        const params =
                            new URLSearchParams(
                                window.location.search
                            );

                        const songId =
                            params.get("id");


                        if (songId) {

                            const selectedSong =
                                songsData.find(
                                    (song) =>
                                        String(song.id) ===
                                        String(songId)
                                );


                            if (selectedSong) {

                                showLyrics(
                                    selectedSong
                                );

                            } else {

                                renderSongs(
                                    data
                                );

                            }

                        } else {

                            renderSongs(
                                data
                            );

                        }


                        window.scrollTo(
                            0,
                            0
                        );

                    })

                    .catch((error) => {

                        console.error(
                            "FETCH ERROR:",
                            error
                        );

                        container.innerHTML =
                            "<p>Error loading songs</p>";

                    });


                /* =================================
                   RENDER SONG LIST
                ================================= */

                function renderSongs(data) {

                    container.innerHTML = "";

                    data.sort(
                        (a, b) =>
                            a.song.localeCompare(
                                b.song
                            )
                    );

                    let currentLetter = "";


                    data.forEach((song) => {

                        const firstLetter =
                            song.song
                                .charAt(0)
                                .toUpperCase();


                        /* =================================
                           ALPHABET SECTION
                        ================================= */

                        if (
                            firstLetter !==
                            currentLetter
                        ) {

                            currentLetter =
                                firstLetter;

                            const section =
                                document.createElement(
                                    "div"
                                );

                            section.innerHTML = `

                                <h2
                                    style="
                                        margin-top:30px;
                                        color:#00d4ff;
                                    "
                                >
                                    🎵 ${currentLetter}
                                </h2>

                            `;

                            container.appendChild(
                                section
                            );

                        }


                        /* =================================
                           SONG ITEM
                        ================================= */

                        const item =
                            document.createElement(
                                "div"
                            );

                        item.classList.add(
                            "song-item"
                        );

                        item.innerHTML = `

                            ${song.song} –

                            <span
                                style="
                                    color:#aaa;
                                "
                            >
                                ${song.movie || ""}
                            </span>

                        `;


                        /* =================================
                           OPEN LANGUAGE SELECTION
                        ================================= */

                        item.addEventListener(
                            "click",
                            () => {

                                window.location.href =
                                   `/pages/admin/lyrics/language.html?type=hindi&id=${song.id}`;

                            }
                        );


                        container.appendChild(
                            item
                        );

                    });

                }


                /* =================================
                   SEARCH SONGS
                ================================= */

                searchInput.addEventListener(
                    "input",
                    () => {

                        const value =
                            searchInput
                                .value
                                .toLowerCase();

                        const filtered =
                            songsData.filter(
                                (song) =>
                                    song.song
                                        .toLowerCase()
                                        .includes(
                                            value
                                        )
                            );


                        renderSongs(
                            filtered
                        );

                        window.scrollTo(
                            0,
                            0
                        );

                    }
                );


                /* =================================
                   DISPLAY SONG LYRICS
                ================================= */

                function showLyrics(song) {

                    const params =
                        new URLSearchParams(
                            window.location.search
                        );

                    const scriptType =
                        params.get("script") ||
                        "english";


                    const lyricsText =
                        scriptType === "english"
                            ? song.lyrics_english
                            : song.lyrics_hindi;


                    container.innerHTML = `

                        <div
                            style="
                                width:100%;
                                margin:40px 0;
                                padding:0 20px;
                            "
                        >

                            <h2>
                                ${song.song}
                            </h2>

                            <p
                                style="
                                    opacity:0.7;
                                "
                            >
                                ${song.movie || ""}
                            </p>

                            <p
                                lang="${
                                    scriptType === "english"
                                        ? "en"
                                        : "hi"
                                }"
                                style="
                                    margin-top:20px;
                                    white-space:pre-line;
                                    line-height:1.9;
                                    font-size:16px;
                                    text-align:left;
                                "
                            >
                                ${
                                    lyricsText ||
                                    "Lyrics coming soon..."
                                }
                            </p>

                        </div>

                    `;


                    /* =================================
                       RESET LYRICS TO TOP
                    ================================= */

                    document.documentElement
                        .scrollTop = 0;

                    document.body
                        .scrollTop = 0;

                    window.scrollTo(
                        0,
                        0
                    );


                    requestAnimationFrame(
                        () => {

                            document.documentElement
                                .scrollTop = 0;

                            document.body
                                .scrollTop = 0;

                            window.scrollTo(
                                0,
                                0
                            );

                        }
                    );

                }


                /* =================================
                   BROWSER BACK BUTTON
                ================================= */

                window.addEventListener(
                    "popstate",
                    () => {

                        renderSongs(
                            songsData
                        );


                        requestAnimationFrame(
                            () => {

                                document.documentElement
                                    .scrollTop = 0;

                                document.body
                                    .scrollTop = 0;

                                window.scrollTo(
                                    0,
                                    0
                                );

                            }
                        );

                    }
                );

            }
        );

    </script>

<!-- =================================
     SHARED PAGE SCRIPTS
================================= -->

<script src="/js/pagebehaviour.js"></script>

<script src="/js/mobile.js"></script>



</body>

</html>
