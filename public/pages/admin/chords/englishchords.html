    <!-- =================================

            ================================== -->

            <input
                type="text"

                placeholder="🔍 Search chords..."

            <!-- =================================
                 SONG LIST / CHORD READER
            ================================== -->

            <div id="lyrics-container"></div>


        </section>

    </main>


    <!-- =================================
         ENGLISH CHORDS JAVASCRIPT
    ================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                const container =
                    document.getElementById(
                        "lyrics-container"
                    );


                const searchInput =
                    document.getElementById(
                        "searchInput"
                    );


                let songsData = [];


                /* =================================
                   LOAD ENGLISH CHORDS
                ================================== */

                fetch("/api/englishchords")

                    .then(res => res.json())

                    .then(data => {


                        songsData = data;


                        searchInput.style.display =
                            "block";


                        renderSongs(
                            songsData
                        );


                        window.scrollTo(
                            0,
                            0
                        );


                    })

                    .catch(err => {


                        console.error(
                            "FETCH ERROR:",
                            err
                        );


                        container.innerHTML =
                            "<p>Error loading chords</p>";


                    });


                /* =================================
                   RENDER SONG LIST
                ================================== */

                function renderSongs(data) {


                    container.innerHTML =
                        "";


                    data.sort(
                        (a, b) =>
                            a.title.localeCompare(
                                b.title
                            )
                    );


                    let currentLetter =
                        "";


                    data.forEach(song => {


                        const firstLetter =
                            song.title
                                .charAt(0)
                                .toUpperCase();


                        /* =================================
                           ALPHABET HEADING
                        ================================== */

                        if (
                            firstLetter !==
                            currentLetter
                        ) {


                            currentLetter =
                                firstLetter;


                            const heading =
                                document.createElement(
                                    "h2"
                                );


                            heading.classList.add(
                                "chord-letter"
                            );


                            heading.textContent =
                                currentLetter;


                            container.appendChild(
                                heading
                            );


                        }


                        /* =================================
                           SONG ITEM
                        ================================== */

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.classList.add(
                            "song-item"
                        );


                        item.innerHTML = `

                            ${song.title} –

                            <span>
                                ${song.movie}
                            </span>

                        `;


                        /* =================================
                           OPEN SONG
                        ================================== */

                        item.addEventListener(
                            "click",
                            () => {


                                searchInput.style.display =
                                    "none";


                                container.innerHTML =
                                    "";


                                history.pushState(
                                    {
                                        page:
                                            "chords"
                                    },
                                    "",
                                    location.pathname
                                );


                                showChords(
                                    song
                                );


                            }
                        );


                        container.appendChild(
                            item
                        );


                    });


                }


                /* =================================
                   SEARCH
                ================================== */

                searchInput.addEventListener(
                    "input",
                    () => {


                        const value =
                            searchInput.value
                                .toLowerCase();


                        const filtered =
                            songsData.filter(
                                song =>
                                    song.title
                                        .toLowerCase()
                                        .includes(
                                            value
                                        )
                            );


                        renderSongs(
                            filtered
                        );


                    }
                );


                /* =================================
                   SHOW SELECTED SONG
                ================================== */

                function showChords(song) {


                    container.innerHTML = `

                        <div class="chord-reader">


                            <!-- SONG TITLE -->

                            <h2 class="chord-song-title">

                                ${song.title}

                                <span class="chord-movie">

                                    - ${song.movie}

                                </span>

                            </h2>


                            <!-- ORIGINAL KEY -->

                            <p class="chord-key">

                                Key:

                                <span id="current-key">
                                    ${song.key || "N/A"}
                                </span>

                            </p>


                            <!-- TRANSPOSE -->

                            <div class="transpose-container">

                                <label
                                    class="transpose-label"
                                    for="transposeSelect"
                                >
                                    Transpose To
                                </label>


                                <select
                                    id="transposeSelect"
                                    class="transpose-select"
                                ></select>

                            </div>


                            <!-- CHORD SHEET -->

                            <div
                                id="chord-content"
                            ></div>


                        </div>

                    `;


                    window.scrollTo(
                        0,
                        0
                    );


                    /* =================================
                       ORIGINAL CHORDS
                    ================================== */

                    const originalChords =
                        song.chords;


                    renderSong(
                        originalChords
                    );


                    /* =================================
                       BUILD DROPDOWN USING transpose.js
                    ================================== */

                    buildTransposeDropdown(
                        song
                    );


                    const select =
                        document.getElementById(
                            "transposeSelect"
                        );


                    /* =================================
                       TRANSPOSE SONG
                    ================================== */

                    select.addEventListener(
                        "change",
                        function () {


                            const transposed =
                                transposeSong(
                                    originalChords,
                                    song.key,
                                    this.value
                                );


                            document
                                .getElementById(
                                    "current-key"
                                )
                                .textContent =
                                    this.value;


                            renderSong(
                                transposed
                            );


                        }
                    );


                }


                /* =================================
                   RENDER CHORD SHEET
                ================================== */

                function renderSong(
                    chordText
                ) {


                    const chordContent =
                        document.getElementById(
                            "chord-content"
                        );


                    const lines =
                        (chordText || "")
                            .split("\n");


                    let html =
                        "";


                    lines.forEach(
                        rawLine => {


                            const line =
                                rawLine.trim();


                            /* =================================
                               EMPTY LINE
                            ================================== */

                            if (!line) {


                                html +=
                                    "<br>";


                                return;


                            }


                            /* =================================
                               SECTION HEADING
                            ================================== */

                            if (
                                line.startsWith(
                                    "# "
                                )
                            ) {


                                const heading =
                                    line.substring(
                                        2
                                    );


                                html += `

                                    <div class="chord-heading">
                                        ${heading}
                                    </div>

                                `;


                                return;


                            }


                            /* =================================
                               LYRIC LINE
                            ================================== */

                            if (
                                line.startsWith(
                                    "> "
                                )
                            ) {


                                const lyric =
                                    line.substring(
                                        2
                                    );


                                html += `

                                    <div class="chord-lyric">
                                        ${lyric}
                                    </div>

                                `;


                                return;


                            }


                            /* =================================
                               CHORD LINE
                            ================================== */

                            html += `

                                <div class="chord-line">${rawLine}</div>

                            `;


                        }
                    );


                    chordContent.innerHTML =
                        html;


                }


                /* =================================
                   BROWSER BACK
                ================================== */

                window.addEventListener(
                    "popstate",
                    () => {


                        searchInput.style.display =
                            "block";


                        searchInput.value =
                            "";


                        renderSongs(
                            songsData
                        );


                        window.scrollTo(
                            0,
                            0
                        );


                    }
                );


            }
        );

    </script>
