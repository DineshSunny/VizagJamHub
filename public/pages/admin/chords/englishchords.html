    <!-- =================================
         ENGLISH CHORDS JAVASCRIPT
    ================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                const container =
                    document.getElementById(
                        "lyrics-container"
                    );


                const searchInput =
                    document.getElementById(
                        "searchInput"
                    );


                let songsData = [];


                /* =================================
                   LOAD ENGLISH CHORDS
                ================================== */

                fetch("/api/englishchords")

                    .then(res => res.json())

                    .then(data => {


                        searchInput.style.display =
                            "block";


                        songsData = data;


                        renderSongs(data);


                        window.scrollTo(
                            0,
                            0
                        );


                    })

                    .catch(err => {


                        console.error(
                            "FETCH ERROR:",
                            err
                        );


                        container.innerHTML =
                            "<p>Error loading chords</p>";


                    });


                /* =================================
                   RENDER SONG LIST
                ================================== */

                function renderSongs(data) {


                    container.innerHTML = "";


                    data.sort(
                        (a, b) =>
                            a.title.localeCompare(
                                b.title
                            )
                    );


                    let currentLetter = "";


                    data.forEach(song => {


                        const firstLetter =
                            song.title
                                .charAt(0)
                                .toUpperCase();


                        if (
                            firstLetter !==
                            currentLetter
                        ) {


                            currentLetter =
                                firstLetter;


                            const section =
                                document.createElement(
                                    "div"
                                );


                            section.innerHTML = `

                                <h2
                                    style="
                                        margin-top: 30px;
                                        color: #00d4ff;
                                    "
                                >
                                    ${currentLetter}
                                </h2>

                            `;


                            container.appendChild(
                                section
                            );


                        }


                        const item =
                            document.createElement(
                                "div"
                            );


                        item.classList.add(
                            "song-item"
                        );


                        item.innerHTML = `

                            ${song.title} –

                            <span
                                style="
                                    color: #aaa;
                                "
                            >
                                ${song.movie}
                            </span>

                        `;


                        item.addEventListener(
                            "click",
                            () => {


                                searchInput.style.display =
                                    "none";


                                container.innerHTML =
                                    "";


                                window.scrollTo(
                                    0,
                                    0
                                );


                                requestAnimationFrame(
                                    () => {


                                        history.pushState(
                                            {
                                                page: "chords"
                                            },
                                            "",
                                            location.pathname
                                        );


                                        showChords(
                                            song
                                        );


                                    }
                                );


                            }
                        );


                        container.appendChild(
                            item
                        );


                    });


                }


                /* =================================
                   SEARCH CHORDS
                ================================== */

                searchInput.addEventListener(
                    "input",
                    () => {


                        const value =
                            searchInput.value
                                .toLowerCase();


                        const filtered =
                            songsData.filter(
                                song =>
                                    song.title
                                        .toLowerCase()
                                        .includes(
                                            value
                                        )
                            );


                        renderSongs(
                            filtered
                        );


                    }
                );


                /* =================================
                   SHOW SELECTED SONG
                ================================== */

                function showChords(song) {


                    container.innerHTML = `

                        <div
                            style="
                                width: 100%;
                                margin: 40px 0;
                                padding: 0 20px;
                            "
                        >

                            <h2
                                class="chord-song-title"
                                style="
                                    text-align: center;
                                "
                            >

                                ${song.title}

                                <span
                                    style="
                                        opacity: 0.6;
                                        font-weight: normal;
                                    "
                                >
                                    - ${song.movie}
                                </span>

                            </h2>


                            <p
                                style="
                                    text-align: center;
                                    opacity: 0.7;
                                    margin-bottom: 8px;
                                "
                            >

                                Key:

                                <span id="current-key">
                                    ${song.key || "N/A"}
                                </span>

                            </p>


                            <div
                                class="transpose-container"
                            >

                                <label
                                    class="transpose-label"
                                    for="transposeSelect"
                                >
                                    Transpose To
                                </label>


                                <select
                                    id="transposeSelect"
                                    class="transpose-select"
                                >
                                </select>

                            </div>


                            <div
                                id="chord-content"
                            ></div>


                        </div>

                    `;


                    window.scrollTo(
                        0,
                        0
                    );


                    const originalChords =
                        song.chords;


                    renderSong(
                        song.chords
                    );


                    buildTransposeDropdown(
                        song
                    );


                    const select =
                        document.getElementById(
                            "transposeSelect"
                        );


                    select.addEventListener(
                        "change",
                        function () {


                            const transposed =
                                transposeSong(
                                    originalChords,
                                    song.key,
                                    this.value
                                );


                            document
                                .getElementById(
                                    "current-key"
                                )
                                .textContent =
                                    this.value;


                            renderSong(
                                transposed
                            );


                        }
                    );


                }


                /* =================================
                   RENDER CHORD CONTENT
                ================================== */

                function renderSong(
                    chordText
                ) {


                    const chordContent =
                        document.getElementById(
                            "chord-content"
                        );


                    const lines =
                        (chordText || "")
                            .split("\n");


                    let html = "";


                    lines.forEach(
                        rawLine => {


                            const line =
                                rawLine.trim();


                            if (!line) {


                                html += "<br>";


                                return;


                            }


                            /* =================================
                               SECTION HEADING
                            ================================== */

                            if (
                                line.startsWith(
                                    "# "
                                )
                            ) {


                                const heading =
                                    line.substring(
                                        2
                                    );


                                html += `

                                    <div
                                        class="chord-heading"
                                    >
                                        ${heading}
                                    </div>

                                `;


                                return;


                            }


                            /* =================================
                               LYRIC LINE
                            ================================== */

                            if (
                                line.startsWith(
                                    "> "
                                )
                            ) {


                                const lyric =
                                    line.substring(
                                        2
                                    );


                                html += `

                                    <div
                                        class="chord-lyric"
                                    >
                                        ${lyric}
                                    </div>

                                `;


                                return;


                            }


                            /* =================================
                               CHORD LINE
                            ================================== */

                            html += `

                                <div
                                    class="chord-line"
                                >
                                    ${line}
                                </div>

                            `;


                        }
                    );


                    chordContent.innerHTML =
                        html;


                }


                /* =================================
                   BROWSER BACK
                ================================== */

                window.addEventListener(
                    "popstate",
                    () => {


                        searchInput.style.display =
                            "block";


                        renderSongs(
                            songsData
                        );


                        window.scrollTo(
                            0,
                            0
                        );


                    }
                );


            }
        );

    </script>
