<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Show | Vizag JamHub</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
      href="/css/mobile.css"
      media="screen and (max-width:768px)">

</head>

<body class="category-page">

<!-- VIDEO BACKGROUND -->

<video autoplay muted loop playsinline preload="metadata" id="bg-video">
<source src="/Video/3.mp4" type="video/mp4">
</video>

<!-- LOGO -->


<div class="top-logo">
<img src="/Images/Logo.png">
</div>


<!-- LIVE TEXT -->

<div class="typing-text" id="live-text">
<span id="typing"></span>
</div>





<!-- MUSIC NOTES -->

<div class="music-notes">

<span>♪</span>
<span>♫</span>
<span>♬</span>
<span>♩</span>
<span>𝄞</span>
<span>♭</span>
<span>♯</span>
<span>♬</span>
<span>♫</span>
<span>♪</span>
<span>♩</span>
<span>𝄢</span>

</div>

<!-- HAMBURGER MENU -->

<header>

<nav>

<div class="menu-toggle">&#9776;</div>

<ul class="nav-links">

<li><a href="/index.html">Home</a></li>

<li><a href="/admin.html">Admin Panel</a></li>

<li><a href="/manage-shows.html">Manage Shows</a></li>

<li><a href="/tickets.html">Tickets</a></li>

</ul>

</nav>

</header>



<!-- =================================
     CREATE SHOW FORM
================================= -->

<section class="hero">

<div class="hero-content">

<form class="create-show-form"
      id="showForm"
      enctype="multipart/form-data">

<input name="title"
       id="showName"
       placeholder="Show Name"
       required>

<input name="venue"
       id="venue"
       placeholder="Venue / Place"
       required>

<input name="address"
       id="address"
       placeholder="Address"
       required>

<input type="date"
       name="date"
       id="date"
       required>

<input type="time"
       name="startTime"
       id="startTime"
       required>

<input type="time"
       name="endTime"
       id="endTime"
       required>

<input type="number"
       name="price"
       id="price"
       placeholder="Ticket Price (₹)">

<input type="file"
       name="poster"
       id="poster">

<textarea name="info"
          id="info"
          class="extra-info"
          placeholder="Extra Information"></textarea>

<button type="submit">
Create Show
</button>

</form>

</div>

</section>



<script>

const words = [

"CREATE SHOW",
"LIVE MUSIC",
"JAM SESSIONS",
"MUSIC COMMUNITY"

];

const typing =
document.getElementById("typing");

let index = 0;

typing.textContent = words[index];
typing.classList.add("show");

setInterval(() => {

typing.classList.remove("show");
typing.classList.add("hide");

setTimeout(() => {

index = (index + 1) % words.length;

typing.textContent = words[index];

typing.classList.remove("hide");
typing.classList.add("show");

}, 900);

}, 3200);

</script>


<script src="/js/menu.js"></script>
<script src="/js/admin.js"></script>

</body>
</html>
