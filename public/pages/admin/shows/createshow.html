<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Show | Vizag JamHub</title>


    <!-- =================================
         DESKTOP CSS
    ================================== -->

    <link rel="stylesheet" href="/css/website/global.css">
    <link rel="stylesheet" href="/css/website/buttons.css">
    <link rel="stylesheet" href="/css/website/forms/forms.css">
    <link rel="stylesheet" href="/css/website/forms/adminforms.css">
    <link rel="stylesheet" href="/css/website/admin.css">


    <!-- =================================
         MOBILE CSS
    ================================== -->

    <link
        rel="stylesheet"
        href="/css/mobile/global.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/buttons.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/forms/forms.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/forms/adminforms.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/admin.css"
        media="screen and (max-width:768px)"
    >


    <!-- =================================
         ICONS
    ================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


    <!-- =================================
         VIDEO BACKGROUND
    ================================== -->

    <video
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        id="bg-video"
    >

        <source
            src="/video/1.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =================================
         MUSIC NOTES
    ================================== -->

    <div class="music-notes">

        <span>♪</span>
        <span>♫</span>
        <span>♬</span>
        <span>♩</span>
        <span>𝄞</span>
        <span>♭</span>
        <span>♯</span>
        <span>♬</span>
        <span>♫</span>
        <span>♪</span>
        <span>♩</span>
        <span>𝄢</span>

    </div>


    <!-- =================================
         NAVIGATION
    ================================== -->

    <header>

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >

            <i class="fa-solid fa-bars"></i>

        </button>


        <div class="nav-overlay">

            <button
                class="menu-close"
                type="button"
                aria-label="Close navigation"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>


            <nav>

                <ul class="nav-links">

                    <li>

                        <a href="/">
                            Home
                        </a>

                    </li>

                    <li>

                        <a href="/pages/admin/admin.html">
                            Admin Panel
                        </a>

                    </li>

                    <li>

                        <a href="/pages/admin/shows/manage-shows.html">
                            Manage Shows
                        </a>

                    </li>

                    <li>

                        <a href="/pages/admin/tickets/ticket.html">
                            Tickets
                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- =================================
         CREATE SHOW
    ================================== -->

    <main
        style="
            position: relative;
            z-index: 3;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 45px 20px 60px;
        "
    >


        <!-- =================================
             HEADING
        ================================== -->

        <h1
            class="admin-title"
            style="
                width: 100%;
                text-align: center;
                margin: 0 0 20px;
            "
        >

            CREATE SHOW

        </h1>


        <!-- =================================
             CREATE SHOW FORM
        ================================== -->

        <form
            class="create-show-form"
            id="showForm"
            enctype="multipart/form-data"
        >


            <!-- =================================
                 SHOW NAME
            ================================== -->

            <input
                type="text"
                name="title"
                id="showName"
                placeholder="Show Name"
                required
            >


            <!-- =================================
                 VENUE
            ================================== -->

            <input
                type="text"
                name="venue"
                id="venue"
                placeholder="Venue / Place"
                required
            >


            <!-- =================================
                 ADDRESS
            ================================== -->

            <input
                type="text"
                name="address"
                id="address"
                placeholder="Address"
                required
            >


            <!-- =================================
                 DATE
            ================================== -->

            <input
                type="date"
                name="date"
                id="date"
                required
            >


            <!-- =================================
                 START TIME
            ================================== -->

            <input
                type="time"
                name="startTime"
                id="startTime"
                required
            >


            <!-- =================================
                 END TIME
            ================================== -->

            <input
                type="time"
                name="endTime"
                id="endTime"
                required
            >


            <!-- =================================
                 TICKET PRICE
            ================================== -->

            <input
                type="number"
                name="price"
                id="price"
                placeholder="Ticket Price (₹)"
            >


            <!-- =================================
                 POSTER
            ================================== -->

            <input
                type="file"
                name="poster"
                id="poster"
                accept="image/*"
            >


            <!-- =================================
                 EXTRA INFORMATION
            ================================== -->

            <textarea
                name="info"
                id="info"
                class="extra-info"
                placeholder="Extra Information"
            ></textarea>


            <!-- =================================
                 CREATE BUTTON
            ================================== -->

            <div class="create-show-action">

                <div class="login-form">

                    <button
                        type="submit"
                        class="login-btn"
                    >
                        CREATE
                    </button>

                </div>

            </div>


        </form>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="/js/others/pagebehaviour.js"></script>
    <script src="/js/mobile/mobile.js"></script>
    <script src="/js/admin/admin.js"></script>


</body>

</html>
