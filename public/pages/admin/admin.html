<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =================================
         PAGE INFORMATION
    ================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | Vizag JamHub</title>


    <!-- =================================
         DESKTOP STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/website/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/logo.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/buttons.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/forms/forms.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/forms/adminforms.css"
    >

    <link
        rel="stylesheet"
        href="/css/website/admin.css"
    >


    <!-- =================================
         MOBILE STYLES
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/mobile/global.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/logo.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/buttons.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/forms/forms.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/forms/adminforms.css"
        media="screen and (max-width:768px)"
    >

    <link
        rel="stylesheet"
        href="/css/mobile/admin.css"
        media="screen and (max-width:768px)"
    >


    <!-- =================================
         FONT AWESOME
    ================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


    <!-- =================================
         BACKGROUND VIDEO
    ================================= -->

    <video
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        id="bg-video"
    >

        <source
            src="/video/1.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =================================
         FLOATING MUSIC NOTES
    ================================= -->

    <div class="music-notes">

        <span>♪</span>
        <span>♫</span>
        <span>♬</span>
        <span>♩</span>
        <span>𝄞</span>
        <span>♭</span>
        <span>♯</span>
        <span>♬</span>
        <span>♫</span>
        <span>♪</span>
        <span>♩</span>
        <span>𝄢</span>

    </div>


    <!-- =================================
         ADMIN LOGIN
    ================================= -->

    <section
        id="adminLogin"
        class="login-section"
    >


        <!-- =================================
             LOGO
        ================================= -->

        <div class="top-logo">

            <img
                src="/images/logo.png"
                alt="Vizag JamHub"
            >

        </div>


        <!-- =================================
             LOGIN TITLE
        ================================= -->

        <h1 class="login-title">
            ADMINISTRATOR LOGIN
        </h1>


        <!-- =================================
             LOGIN FORM
        ================================= -->

        <div class="login-form">


            <!-- =================================
                 PASSWORD
            ================================= -->

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                >

                <button
                    class="toggle-password"
                    type="button"
                    onclick="togglePassword()"
                    aria-label="Show or hide password"
                >

                    <i
                        id="password-icon"
                        class="fa-solid fa-eye"
                    ></i>

                </button>

            </div>


            <!-- =================================
                 LOGIN BUTTON
            ================================= -->

            <button
                type="button"
                class="login-btn"
                onclick="login()"
            >
                Login
            </button>


            <!-- =================================
                 LOGIN ERROR
            ================================= -->

            <p id="error"></p>


        </div>

    </section>


    <!-- =================================
         ADMIN PANEL
    ================================= -->

    <section
        id="adminPanel"
        class="admin-panel"
        style="display: none;"
    >


        <!-- =================================
             ADMIN TITLE
        ================================= -->

        <h1 class="admin-title">
            ADMIN PANEL
        </h1>


        <!-- =================================
             ADMIN BUTTONS
        ================================= -->

        <div class="admin-buttons">

            <ul class="nav-links">


                <li>

                    <a
                        href="/pages/admin/shows/createshow.html"
                    >
                        Create Show
                    </a>

                </li>


                <li>

                    <a
                        href="/pages/admin/shows/manage-shows.html"
                    >
                        Manage Shows
                    </a>

                </li>


                <li>

                    <a
                        href="/pages/admin/chords/chord-library.html"
                    >
                        Chord Library
                    </a>

                </li>


                <li>

                    <a
                        href="#"
                        aria-disabled="true"
                        onclick="event.preventDefault();"
                    >
                        Set Lists
                    </a>

                </li>


                <li>

                    <a
                        href="/pages/admin/tickets/ticket.html"
                    >
                        Tickets
                    </a>

                </li>


            </ul>

        </div>


        <!-- =================================
             LOGOUT
        ================================= -->

       <button
    type="button"
    class="login-btn logout-btn"
    onclick="logout()"
>
    Logout
</button>

    </section>


    <!-- =================================
         SHARED JAVASCRIPT
    ================================= -->

    <script src="/js/others/pagebehaviour.js"></script>

    <script src="/js/mobile/mobile.js"></script>


    <!-- =================================
         ADMIN JAVASCRIPT
    ================================= -->

    <script src="/js/admin/admin.js"></script>


</body>

</html>
